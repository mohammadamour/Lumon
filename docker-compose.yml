version: '3.8'

services:
  # 1. The PHP Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumon-app
    container_name: lumon-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - lumon

  # 2. The Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: lumon-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lumon
    depends_on:
      - app

  # 3. The Database (MySQL)
  db:
    image: mysql:8.0
    container_name: lumon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - lumon

  # 4. The Frontend Compiler (Vite/Node)
  node:
    image: node:20-alpine
    container_name: lumon-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - lumon

networks:
  lumon:
    driver: bridge

volumes:
  dbdata:
    driver: local
