version: '3.8'

services:
  # 1. The PHP Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumon-app
    container_name: lumon-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - lumon

  # 2. The Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: lumon-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lumon
    depends_on:
      - app

  # 3. The Database (MySQL)
  db:
    image: mysql:8.0
    container_name: lumon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - lumon

  # 4. The Frontend Compiler (Vite/Node)
  node:
    image: node:20-alpine
    container_name: lumon-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - lumon

  # 5. Selenium / Chrome (For Dusk E2E Tests)
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: lumon-selenium
    restart: unless-stopped
    ports:
      - "4444:4444"
    networks:
      - lumon

  # 6. Redis (Cache, Queues, Sessions)
  redis:
    image: redis:alpine
    container_name: lumon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - lumon
    volumes:
      - redisdata:/data

  # 7. Meilisearch (Search Engine)
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: lumon-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "masterKey"
      MEILI_NO_ANALYTICS: "true"
    networks:
      - lumon
    volumes:
      - meilisearchdata:/meili_data

networks:
  lumon:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  meilisearchdata:
    driver: local
